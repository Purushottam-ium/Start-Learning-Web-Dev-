<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Tables</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
    <table border="2">
        <caption>Laptop preferance</caption>
        <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>laptop</th>
            <th>header</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Rohan</td>
            <td>18</td>
            <td>Hp</td>
            <td colspan="5">body</td>
            <td>home</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td>Sumit</td>
            <td >19</td>
            <td>Dell</td>
            <td>new foot</td>
        </tr>
        <tr>
            <td>Arvind</td>
            <td>Dell</td>
            <td>foot</td>
        </tr>
        </tfoot>
    </table>
    <br>
    <table border="1">
        <tr>
            <td colspan="2">Merged Columns</td>
        </tr>
        <tr>
            <td>Column 1</td>
            <td>Column 2</td>
        </tr>
    </table>
</body>

</html>
